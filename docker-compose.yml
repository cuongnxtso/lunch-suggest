# Everything LunchSuggest needs. `docker compose up -d --build` serves the site on port 8686 of this machine (all network interfaces).
# Only "web" is reachable from the LAN; the database, Ollama and SearXNG stay on 127.0.0.1.
services:
  web:
    build: .
    # 8686: the site for everyone. 8690: the same site plus /settings, published on this computer's loopback only,
    # so LAN machines can't connect to it (Docker Desktop hides callers' IPs, so an IP check alone can't tell them apart).
    ports: ["8686:8080", "127.0.0.1:8690:8081"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080;8081"
      Admin__Port: "8081"
      # Address in the invite link (this PC's LAN IP). Only fills an empty setting; change it later on the Settings page.
      Lunch__ShareUrl: http://10.3.0.54:8686
      ConnectionStrings__Lunch: Host=db;Port=5432;Database=lunch;Username=lunch;Password=lunch
      Search__OllamaUrl: http://ollama:11434
      Dishes__SearxngUrl: http://searxng:8080
      # Google sign-in for voting (README, "Sign-in"); empty = off. Needs the site on HTTPS (the ngrok service below).
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    volumes: [dpkeys:/keys]
    depends_on:
      db: { condition: service_healthy }
      ollama: { condition: service_started }
      searxng: { condition: service_started }
    restart: unless-stopped

  # Public HTTPS address for the site (Google sign-in needs HTTPS). Only starts with COMPOSE_PROFILES=ngrok in .env;
  # see .env.example and README "Sign-in".
  ngrok:
    image: ngrok/ngrok:latest
    profiles: [ngrok]
    command: ["http", "--url=${NGROK_DOMAIN:-}", "web:8080"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on: [web]
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lunch
      POSTGRES_PASSWORD: lunch
      POSTGRES_DB: lunch
    ports: ["127.0.0.1:5442:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunch -d lunch"]
      interval: 5s
      retries: 12
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]
    # Pull both models on first start (~2.3 GB together), then keep serving.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull nomic-embed-text && ollama pull qwen2.5:3b && wait"]
    restart: unless-stopped

  # Meta search engine with a JSON API, used to find each place's top dishes. Free, no key.
  searxng:
    image: searxng/searxng:latest
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_SECRET: local-dev-only-change-me
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    restart: unless-stopped

volumes:
  pgdata: {}
  ollama: {}
  dpkeys: {}
